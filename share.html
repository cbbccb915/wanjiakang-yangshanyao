<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0b7a4b;color:#fff}
  .card{width:1200px;height:630px;padding:58px 64px;position:relative;overflow:hidden;background:
    radial-gradient(circle at 88% 18%,rgba(242,183,5,.28),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(255,255,255,.12),transparent 32%),
    linear-gradient(135deg,#0b7a4b 0%,#075435 100%)}
  .brand{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;letter-spacing:2px;color:#d9f5e6}
  .mark{width:52px;height:52px;border-radius:14px;background:#fff;color:#0b7a4b;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
  h1{margin-top:54px;font-size:64px;line-height:1.12;letter-spacing:-1px;font-weight:900}
  h1 span{color:#ffd45c}
  .sub{margin-top:20px;font-size:25px;color:#d9f5e6;letter-spacing:1px}
  .services{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
  .services b{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:11px 18px;font-size:17px;font-weight:600}
  .bottom{position:absolute;left:64px;right:64px;bottom:48px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .addr{font-size:17px;line-height:1.75;color:#d9f5e6}
  .addr strong{display:block;font-size:22px;color:#fff;margin-bottom:4px}
  .phone{font-size:15px;color:#bfe9d3;margin-top:8px}
  .qr{width:178px;background:#fff;border-radius:16px;padding:10px;text-align:center;flex-shrink:0}
  .qr img{width:158px;height:158px;display:block}
  .qr span{display:block;color:#0b5d3a;font-size:12px;font-weight:700;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="mark">万</div>万家康医药连锁 · 羊山窑店</div>
  <h1>羊山窑子村<br><span>家门口的药店</span></h1>
  <div class="sub">药品零售 · 医疗器械 · 消杀用品</div>
  <div class="services"><b>周一至周六 8:00-20:00</b><b>地址：羊山窑子村西区4排107号</b><b>电话问路</b></div>
  <div class="bottom">
    <div class="addr">
      <strong>包头市青山区兴胜镇羊山窑子村西区4排107号</strong>
      店名在地图上不一定能搜到，建议复制地址或电话问路。
      <div class="phone">门店电话 131 7148 2410 · 备用电话 138 4721 5704</div>
    </div>
    <div class="qr"><img src="assets/qr.png" alt="扫码打开门店页"><span>扫码看地址/电话</span></div>
  </div>
</div>
</body>
</html>
